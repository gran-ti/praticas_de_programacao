<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho de Compras</title>
  <link rel="stylesheet"
     href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
     href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="carrinho.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
      defer></script>
  <script src="carrinho.js" defer></script>
</head>
<body>
  <main class="container bg-white rounded-top mt-5 zero-pad">
    <div class="row d-flex justify-content-center">
      <div class="col-lg-10 col-12 pt-3">
        <header class="d-flex">
          <div><img src="img/logo-loja-gran.png" width="200" height="100" alt="Loja Gran"></div>
          <nav class="ml-auto d-flex" aria-label="Conta e ajuda">
            <div class="p-2"><a href="#" class="text-dark text-decoration-none mobile-font">ENTRAR</a></div>
            <div class="p-2"><a href="#" class="text-dark text-decoration-none mobile-font">AJUDA</a></div>
          </nav>
        </header>
        <div class="d-flex flex-column pt-4">
          <h1 class="h5 text-uppercase font-weight-normal">Lojinha da GranCursos</h1>
          <div class="font-weight-normal" id="totalItens">0 itens</div>
        </div>
        <div class="d-flex flex-row px-lg-5 mx-lg-5 mobile" id="heading" aria-hidden="true">
          <div class="px-lg-5 mr-lg-5" id="produc">PRODUTOS</div>
          <div class="px-lg-5 ml-lg-5" id="prc">PREÇO</div>
          <div class="px-lg-5 ml-lg-1" id="quantity">QUANTIDADE</div>
          <div class="px-lg-5 ml-lg-3" id="total">TOTAL</div>
        </div>
        <!-- Produto 0 -->
        <div id="produto0" class="d-flex flex-row justify-content-between
              align-items-center pt-lg-4 pt-2 pb-3 border-bottom mobile">
          <div class="d-flex flex-row align-items-center">
            <div><img src="img/caneca-eu-dou-conta.jpg" width="150" height="150"
                 alt="Caneca branca “Eu dou conta!”" class="imagem-produto"></div>
            <div class="d-flex flex-column pl-md-3 pl-1">
              <h2 class="h6">Caneca Eu dou Conta</h2>
              <div>Código:<span class="pl-2">091091001</span></div>
              <div>Cor:<span class="pl-3">Branco</span></div>
            </div>
          </div>
          <div class="pl-md-0 pl-1"><b>R$ 45,00</b></div>
          <div class="pl-md-0 pl-2 text-nowrap">
            <button type="button" class="btn-icone" onclick="removerItem(0)"
                aria-label="Diminuir a quantidade de Caneca Eu dou Conta">
              <span class="fa fa-minus-square text-secondary" aria-hidden="true"></span>
            </button>
            <span class="px-md-3 px-1" id="quantidade0" aria-live="polite">0</span>
            <button type="button" class="btn-icone" onclick="adicionarItem(0)"
                aria-label="Aumentar a quantidade de Caneca Eu dou Conta">
              <span class="fa fa-plus-square text-secondary" aria-hidden="true"></span>
            </button>
          </div>
          <div class="pl-md-0 pl-1"><b id="total0">R$ 0,00</b></div>
          <button type="button" class="close" onclick="zerarItem(0)"
              aria-label="Remover Caneca Eu dou Conta do carrinho">&times;</button>
        </div>
        <!-- Produto 1 -->
        <div id="produto1" class="d-flex flex-row justify-content-between
              align-items-center pt-lg-4 pt-2 pb-3 border-bottom mobile">
          <div class="d-flex flex-row align-items-center">
            <div><img src="img/moleskine.jpg" width="150" height="150"
                 alt="Caderno Moleskine vermelho" class="imagem-produto"></div>
            <div class="d-flex flex-column pl-md-3 pl-1">
              <h2 class="h6">Moleskine</h2>
              <div>Código:<span class="pl-2">056289891</span></div>
              <div>Cor:<span class="pl-3">Vermelho</span></div>
            </div>
          </div>
          <div class="pl-md-0 pl-1"><b>R$ 39,90</b></div>
          <div class="pl-md-0 pl-2 text-nowrap">
            <button type="button" class="btn-icone" onclick="removerItem(1)"
                aria-label="Diminuir a quantidade de Moleskine">
              <span class="fa fa-minus-square text-secondary" aria-hidden="true"></span>
            </button>
            <span class="px-md-3 px-1" id="quantidade1" aria-live="polite">0</span>
            <button type="button" class="btn-icone" onclick="adicionarItem(1)"
                aria-label="Aumentar a quantidade de Moleskine">
              <span class="fa fa-plus-square text-secondary" aria-hidden="true"></span>
            </button>
          </div>
          <div class="pl-md-0 pl-1"><b id="total1">R$ 0,00</b></div>
          <button type="button" class="close" onclick="zerarItem(1)"
              aria-label="Remover Moleskine do carrinho">&times;</button>
        </div>
        <!-- Produto 2 -->
        <div id="produto2" class="d-flex flex-row justify-content-between
              align-items-center pt-lg-4 pt-2 pb-3 border-bottom mobile">
          <div class="d-flex flex-row align-items-center">
            <div><img src="img/caneca-magica.jpg" width="150" height="150"
                 alt="Caneca bege com alça e colher vermelhas" class="imagem-produto"></div>
            <div class="d-flex flex-column pl-md-3 pl-1">
              <h2 class="h6">Caneca Mágica</h2>
              <div>Código:<span class="pl-2">091091002</span></div>
              <div>Cor:<span class="pl-3">Bege</span></div>
            </div>
          </div>
          <div class="pl-md-0 pl-1"><b>R$ 49,90</b></div>
          <div class="pl-md-0 pl-2 text-nowrap">
            <button type="button" class="btn-icone" onclick="removerItem(2)"
                aria-label="Diminuir a quantidade de Caneca Mágica">
              <span class="fa fa-minus-square text-secondary" aria-hidden="true"></span>
            </button>
            <span class="px-md-3 px-1" id="quantidade2" aria-live="polite">0</span>
            <button type="button" class="btn-icone" onclick="adicionarItem(2)"
                aria-label="Aumentar a quantidade de Caneca Mágica">
              <span class="fa fa-plus-square text-secondary" aria-hidden="true"></span>
            </button>
          </div>
          <div class="pl-md-0 pl-1"><b id="total2">R$ 0,00</b></div>
          <button type="button" class="close" onclick="zerarItem(2)"
              aria-label="Remover Caneca Mágica do carrinho">&times;</button>
        </div>
      </div>
    </div>
  </main>
  <footer class="container bg-light rounded-bottom py-4 zero-pad">
    <div class="row d-flex justify-content-center">
      <div class="col-lg-10 col-12">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <button type="button" class="btn btn-sm bg-light border border-dark">VOLTAR</button>
          </div>
          <div class="px-md-0 px-1 footer-font">
            <b class="pl-md-4">SUBTOTAL
              <span class="pl-md-4" id="valorTotalCompra" aria-live="polite">R$ 0,00</span>
            </b>
          </div>
          <div>
            <button type="button" class="btn btn-sm bg-dark text-white px-lg-5 px-3">CONTINUAR</button>
          </div>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
